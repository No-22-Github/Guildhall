[project]
name = "guildhall-server"
version = "0.1.0"
description = "Guildhall — 单人用的委托流水线:receptionist 拷问出委托单,adventurer 干活,appraiser 验收,人拍板"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "tomlkit>=0.15.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guildhall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
